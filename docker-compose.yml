services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: charla
      POSTGRES_PASSWORD: charla
      POSTGRES_DB: charla
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charla"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
